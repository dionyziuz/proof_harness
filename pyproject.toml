[project]
name = "prime-math"
version = "0.1.0"
description = "Agentic mathematical reasoning and persistent Python execution harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.2.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.3.0",
    "mpmath>=1.3.0",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "turbovec>=1.1.2",
    "z3-solver>=5.1.0.0",
]

[project.scripts]
prime-math = "core_engine.cli:main"

[tool.setuptools.packages.find]
include = ["core_engine*"]
